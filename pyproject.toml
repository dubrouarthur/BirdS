[project]
name = "birds"
version = "0.1.0"
description = "BirdS: a small, frugal enterprise LLM (Qwen3.5-4B based)"
requires-python = ">=3.11"
license = "Apache-2.0"
# Core = what the deployed web app and the agent harness import at run time. Keep it light: Vercel installs
# exactly this list in the function (it reads pyproject.toml before requirements.txt). Training and data
# preparation need the `data` / `train` groups below.
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "jsonschema>=4",
    "trafilatura>=2",
    "python-pptx>=1",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pypdf>=5",
    "pypdfium2>=4",
    "pillow>=10",  # already pulled in by python-pptx; /api/img re-encodes web images with it
]

[project.optional-dependencies]
data = ["datasets>=3", "huggingface_hub", "transformers>=5.2"]
train = ["datasets>=3", "huggingface_hub", "transformers>=5.2", "torch", "peft>=0.17", "accelerate", "flash-linear-attention"]
dev = ["pytest", "ruff", "uvicorn"]
web = ["uvicorn"]  # local server; fastapi and httpx are core
harness = ["transformers>=5.2"]  # only for the real tokenizer (token counts, --local); the tools are core

[tool.vercel]
entrypoint = "app:app"


[tool.setuptools.package-data]
birds = ["web/static/*", "web/static/demo/*", "web/static/fonts/*", "web/demo_data/*", "harness/chat_template.jinja"]

[tool.setuptools.packages.find]
include = ["birds*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
